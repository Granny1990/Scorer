name: Ergebnisse aktualisieren

on:
  schedule:
    - cron: "5 16,17,18,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scorer
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: pip install beautifulsoup4

      - name: Ergebnisse holen
        run: python scripts/scorer.py

      - name: Aenderungen committen
        run: |
          git config user.name "Scorer Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data debug 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Ergebnisse $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
            git push
          fi
